# database configration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dockmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
show-sql=true
properties.hibernate.format_sql=true

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:demo-key}
chatgpt.model=${CHATGPT_MODEL:gpt-3.5-turbo}
temperature=${CHATGPT_TEMPERATURE:0.7}
embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
vectorstore.pgvector.index.type=${VECTORSTORE_PGVECTOR_INDEX_TYPE:HNSW}
vectorstore.pgvector.distance.type=${VECTORSTORE_PGVECTOR_DISTANCE_TYPE:cosine}