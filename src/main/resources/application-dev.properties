# Database Configuration

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate Configuration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration

spring.servlet.multipart.max-file-size=24MB
spring.servlet.multipart.max-request-size=24MB

# OpenAI Configuration

spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-3.5-turbo}
spring.ai.openai.chat.temperature=${OPENAI_CHAT_TEMPERATURE:0.2}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# PGVector Configuration

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimension=1536
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true

# Application / RAG Configuration

#noinspection SpringBootApplicationProperties
app.rag.chunk-size=600
app.rag.chunk-overlap=100
app.rag.top-k=5
app.rag.similarity-threshold=0.0

# CORS Configuration

app.cors.allowed-origins="*"
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers="*"