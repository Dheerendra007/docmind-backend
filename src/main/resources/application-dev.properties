# database configration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dockmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
show-sql=true
properties.hibernate.format_sql=true

# OpenAI Configuration
ai.openai.api.key=${OPENAI_API_KEY:demo-key}
ai.openai.chat.model=${CHATGPT_MODEL:gpt-3.5-turbo}
ai.openai.chat.temperature=${CHATGPT_TEMPERATURE:0.7}
ai.openai.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}

vectorstore.pgvector.index.type=${VECTORSTORE_PGVECTOR_INDEX_TYPE:HNSW}
vectorstore.pgvector.distance.type=${VECTORSTORE_PGVECTOR_DISTANCE_TYPE:cosine}
vectorstore.pgvector.dimension=${VECTORSTORE_PGVECTOR_DIMENSION:1536}
vectorstore.pgvector.table.name=${VECTORSTORE_PGVECTOR_TABLE_NAME:vector_store}
vectorstore.pgvector.schema.name=${VECTORSTORE_PGVECTOR_SCHEMA_NAME:public}
vectorstore.pgvector.initialize-schema=${VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:true}

# App Configuration
app.rag.chunk.size=${APP_RAG_CHUNK_SIZE:500}
app.rag.chunk.overlap=${APP_RAG_CHUNK_OVERLAP:50}
app.rag.top-k=${APP_RAG_TOP_K:5}
app.rag.similarity.threshold=${APP_RAG_SIMILARITY_THRESHOLD:0.8}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:Content-Type,Authorization}